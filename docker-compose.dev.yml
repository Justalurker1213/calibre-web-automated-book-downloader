services:
  calibre-web-automated-book-downloader-dev:
    extends:
      file: ./docker-compose.yml
      service: calibre-web-automated-book-downloader
    build:
      context: .
      dockerfile: Dockerfile
      target: cwa-bd
    environment:
      DEBUG: true
      APP_ENV: dev
      USE_DOH: true
      CUSTOM_DNS: cloudflare
      HARDCOVER_ENABLE: "false" # Set to "true" to enable Hardcover integration
      HARDCOVER_API_KEY: "" # Your Hardcover API Key
      HARDCOVER_API_URL: "https://api.hardcover.app/v1/graphql"
    volumes:
      - /tmp/cwa-book-downloader:/tmp/cwa-book-downloader
      - /tmp/cwa-book-downloader-log:/var/log/cwa-book-downloader
